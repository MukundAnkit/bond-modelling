[project]
name = "bond-modelling"
version = "0.1.0"
description = "Progressive fixed-income pricing and risk engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MukundAnkit" },
]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.11.0",
]

[project.urls]
homepage = "https://github.com/MukundAnkit/bond-modelling"
repository = "https://github.com/MukundAnkit/bond-modelling.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "jupyter>=1.0",
    "pandas-datareader>=0.10",
    "yfinance>=0.2",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "ARG"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"*.ipynb" = ["E501", "F541", "F811", "I001", "D100", "D101", "D102", "D103", "D104", "D401", "D205", "D209", "B905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
